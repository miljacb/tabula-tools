[build]
  # Netlify installs deps itself (pnpm, detected from pnpm-lock.yaml); corepack pins the
  # pnpm version from package.json's packageManager field.
  command = "pnpm build:web"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "24"
  COREPACK_ENABLE_STRICT = "0"
  PNPM_FLAGS = "--frozen-lockfile"

# The viewer is a single-page app under /viewer/.
[[redirects]]
  from = "/viewer/*"
  to = "/viewer/index.html"
  status = 200

# Cross-origin isolation for the viewer: lets its Performance panel measure page memory
# (performance.measureUserAgentSpecificMemory). Same headers as the Vite dev/preview servers.
[[headers]]
  for = "/viewer/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
